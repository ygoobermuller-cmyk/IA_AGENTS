<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Pro Enterprise</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-main: #09090b; 
            --bg-sidebar: #050507; 
            --bg-panel: #121216;
            --bg-hover: #1a1a21;
            --border-color: #27272a; 
            --border-focus: #3b82f6;
            --text-primary: #fafafa; 
            --text-secondary: #a1a1aa;
            --accent-blue: #3b82f6; 
            --accent-hover: #2563eb;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --font-ui: 'Plus Jakarta Sans', sans-serif; 
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }
        body { background-color: var(--bg-main); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Sidebar Executiva */
        .sidebar { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 16px; gap: 20px; z-index: 10; }
        
        .sidebar-header h1 { font-size: 17px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px; }
        
        .btn-primary { background: var(--accent-blue); color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25); display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35); }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; }
        .select-box { background: var(--bg-panel); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 10px; padding: 11px; font-size: 13px; outline: none; cursor: pointer; transition: all 0.2s; }
        .select-box:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }

        .history-section { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .history-section-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;}
        
        .chat-item { padding: 11px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; transition: all 0.15s ease; border: 1px solid transparent; }
        .chat-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .chat-item.active { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); font-weight: 500; }
        .delete-btn { color: #ef4444; font-size: 13px; cursor: pointer; opacity: 0; transition: opacity 0.15s; padding: 2px 6px; border-radius: 4px;}
        .delete-btn:hover { background: rgba(239, 68, 68, 0.15); }
        .chat-item:hover .delete-btn { opacity: 1; }

        /* Área do Chat Principal */
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); position: relative; }
        
        .chat-header { padding: 16px 32px; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
        .header-info h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
        .header-info span { font-size: 12px; color: var(--text-secondary); }

        .header-actions { display: flex; gap: 8px; }
        .btn-export { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;}
        .btn-export:hover { border-color: #3f3f46; color: var(--text-primary); background: var(--bg-hover); }
        .btn-clear { border-color: rgba(239, 68, 68, 0.3); color: #f87171; }
        .btn-clear:hover { border-color: #ef4444; color: #fca5a5; background: rgba(239, 68, 68, 0.1); }

        .chat-messages { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
        
        .message-wrapper { display: flex; width: 100%; justify-content: flex-start; animation: fadeIn 0.3s ease; }
        .message-wrapper.user { justify-content: flex-end; }
        
        .message { max-width: 80%; padding: 16px 20px; border-radius: 14px; font-size: 14px; line-height: 1.6; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .message.user { background: var(--bg-panel); border: 1px solid var(--border-color); color: #f4f4f5; border-bottom-right-radius: 4px; }
        .message.bot { background: transparent; color: var(--text-primary); width: 100%; padding: 0; border: none; box-shadow: none; }

        /* Welcome Hero Sofisticado */
        .welcome-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--text-secondary); animation: fadeIn 0.4s ease; }
        .welcome-hero h2 { font-size: 26px; color: #fff; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
        .welcome-hero p { font-size: 14px; margin-bottom: 28px; color: var(--text-secondary); }
        
        .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
        .quick-btn { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-primary); padding: 14px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; justify-content: flex-start; }
        .quick-btn:hover { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.08); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59,130,246,0.12); color: #fff;}

        /* Typing Indicator elegante */
        .typing-indicator { display: flex; gap: 5px; padding: 12px 16px; align-items: center; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; width: fit-content; }
        .typing-indicator span { width: 7px; height: 7px; background-color: var(--accent-blue); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message.bot p { margin-bottom: 12px; }
        .message.bot p:last-child { margin-bottom: 0; }
        
        /* Bloco de Código Estilo IDE */
        .code-wrapper { margin: 16px 0; background: #0c0c0e; border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .code-header { display: flex; justify-content: space-between; align-items: center; background: #141418; padding: 10px 16px; border-bottom: 1px solid var(--border-color); }
        .mac-dots { display: flex; gap: 6px; }
        .mac-dots span { width: 10px; height: 10px; border-radius: 50%; }
        .mac-dots .red { background: #ff5f56; }
        .mac-dots .yellow { background: #ffbd2e; }
        .mac-dots .green { background: #27c93f; }
        .code-lang { color: #71717a; font-size: 11px; font-family: var(--font-code); text-transform: uppercase; letter-spacing: 1px; margin-left: 12px; flex: 1; }
        .copy-btn { background: #22222b; border: 1px solid #3f3f46; color: #e4e4e7; cursor: pointer; font-size: 11px; padding: 5px 12px; border-radius: 6px; transition: 0.2s; font-weight: 500;}
        .copy-btn:hover { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .code-wrapper pre { margin: 0; padding: 18px; overflow-x: auto; }
        .code-wrapper code { font-family: var(--font-code); font-size: 13px; color: #e4e4e7; line-height: 1.6; }
        
        /* Área de Input Fluida */
        .input-area { padding: 20px 32px; background: linear-gradient(to top, var(--bg-main) 75%, transparent); display: flex; flex-direction: column; gap: 10px; }
        .input-box { flex: 1; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 14px; display: flex; padding: 12px 18px; align-items: flex-end; transition: all 0.2s; box-shadow: 0 4px 24px rgba(0,0,0,0.25); }
        .input-box:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2), 0 4px 24px rgba(0,0,0,0.3); }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 14.5px; resize: none; outline: none; max-height: 200px; line-height: 1.5; padding: 4px 0; }
        
        .attach-wrapper { position: relative; margin-right: 12px; padding-bottom: 4px;}
        .attach-btn { cursor: pointer; color: #71717a; font-size: 20px; transition: color 0.2s; display: flex; align-items: center; justify-content: center;}
        .attach-btn:hover { color: var(--accent-blue); }
        
        .send-btn-circle { background: var(--accent-blue); border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; margin-left: 12px; box-shadow: 0 2px 10px rgba(59,130,246,0.3);}
        .send-btn-circle:hover { background: var(--accent-hover); transform: scale(1.06); }
        .send-btn-circle svg { fill: white; width: 16px; height: 16px; margin-left: 2px; }

        #preview-container { display: none; align-items: center; gap: 10px; background: rgba(59, 130, 246, 0.1); padding: 8px 14px; border-radius: 10px; width: fit-content; font-size: 12px; border: 1px solid rgba(59, 130, 246, 0.25); color: #93c5fd; font-weight: 500; margin-bottom: 4px;}
        #remove-file { color: #f87171; cursor: pointer; font-weight: bold; margin-left: 8px; padding: 2px 6px; border-radius: 4px;}
        #remove-file:hover { background: rgba(248, 113, 113, 0.2); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#8b5cf6" /></linearGradient></defs><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> AI Hub Pro</h1>
        </div>
        <button class="btn-primary" onclick="newChat()">+ Novo Workspace</button>

        <div class="form-group">
            <label>Contexto Operacional</label>
            <select id="agent-select" class="select-box" onchange="updateSession()">
                <option value="Geral">🛡️ Assistente Geral</option>
                <option value="Sistemas">⚙️ Infra & SAP/Salesforce</option>
                <option value="Dev">💻 Código & Integrações</option>
            </select>
        </div>

        <div class="history-section">
            <div class="history-section-title">Workspaces Anteriores</div>
            <div id="history-list"></div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <h3 id="chat-title">Novo Workspace</h3>
                <span id="chat-sub">Sistema Operativo • Pronto</span>
            </div>
            <div class="header-actions">
                <button class="btn-export btn-clear" onclick="clearCurrentChat()">🗑️ Limpar Chat</button>
                <button class="btn-export" onclick="exportTXT()">.TXT</button>
                <button class="btn-export" onclick="exportPDF()">.PDF</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="input-area">
            <div id="preview-container">
                📄 <span id="file-name"></span>
                <span id="remove-file" onclick="clearFile()">✕</span>
            </div>
            <div class="input-box">
                <div class="attach-wrapper">
                    <label for="file-input" class="attach-btn" title="Anexar Script / Log">📎</label>
                    <input type="file" id="file-input" accept=".txt,.csv,.json,.js,.log,.md,.sql" style="display:none;" onchange="handleFile(event)" />
                </div>
                <textarea id="user-input" rows="1" placeholder="Descreva o desafio ou cole um script para análise..." oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
                <button class="send-btn-circle" onclick="sendMsg()" title="Enviar Instrução">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const renderer = new marked.Renderer();
        renderer.code = function({text, lang}) {
            const codeContent = text.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `
                <div class="code-wrapper">
                    <div class="code-header">
                        <div class="mac-dots"><span class="red"></span><span class="yellow"></span><span class="green"></span></div>
                        <span class="code-lang">${lang || 'CODE'}</span>
                        <button class="copy-btn" onclick="copyCode(this, \`${codeContent.replace(/`/g, '\\`')}\`)">Copiar</button>
                    </div>
                    <pre><code>${codeContent}</code></pre>
                </div>`;
        };
        marked.setOptions({ renderer: renderer });

        function copyCode(btn, content) {
            navigator.clipboard.writeText(content);
            btn.innerText = "Copiado!";
            btn.style.background = "#22c55e";
            btn.style.borderColor = "#22c55e";
            btn.style.color = "#fff";
            setTimeout(() => { 
                btn.innerText = "Copiar"; 
                btn.style.background = "#22222b"; 
                btn.style.borderColor = "#3f3f46";
                btn.style.color = "#e4e4e7"; 
            }, 2000);
        }

        const personas = {
            "Geral": "És um assistente corporativo versátil, especialista em produtividade e análise. Respostas diretas e limpas.",
            "Sistemas": "És um engenheiro sénior de infraestrutura e sistemas empresariais. Especialista em SAP S/4HANA, Salesforce e Senior HCM. Responde de forma estruturada e altamente técnica.",
            "Dev": "És um Arquiteto de Software Sénior. Especialista em Node.js, Vercel, MCP (Model Context Protocol) e APIs. Gera código limpo."
        };

        const dynamicPrompts = {
            "Geral": [
                { icon: "📝", text: "Redigir e-mail formal", prompt: "Ajuda-me a escrever um e-mail corporativo comunicando uma atualização agendada na infraestrutura do sistema." },
                { icon: "📊", text: "Resumir ficheiro", prompt: "Podes extrair os pontos mais importantes e resumir os dados se eu te fornecer um ficheiro ou log longo?" },
                { icon: "🗓️", text: "Estruturar Tarefas", prompt: "Cria um plano de ação estruturado com prioridades para a migração de um novo sistema na empresa." }
            ],
            "Sistemas": [
                { icon: "⚡", text: "Otimizar Processo SAP", prompt: "Gostaria de criar uma proposta para otimizar pagamentos manuais usando a transação FV60 no SAP. Ajuda-me a estruturar a ideia." },
                { icon: "☁️", text: "Query Salesforce (SOQL)", prompt: "Cria uma query SOQL no Salesforce para extrair todos os utilizadores inativos no último trimestre." },
                { icon: "🔍", text: "Diagnóstico Senior HCM", prompt: "Estou a rever tabelas no banco de dados do Senior Sistemas. Que boas práticas recomendas para extrair relatórios sem afetar a performance?" }
            ],
            "Dev": [
                { icon: "🔌", text: "Estrutura MCP Server", prompt: "Gera a estrutura base de um servidor MCP (Model Context Protocol) em Node.js para ligar o nosso sistema a uma LLM local." },
                { icon: "⚙️", text: "Lógica Power Automate", prompt: "Ajuda-me a criar uma lógica avançada no Microsoft Power Automate para aprovação de ficheiros recebidos por e-mail." },
                { icon: "🐛", text: "Depurar Código JS", prompt: "Tenho um script Javascript/Node.js que está a dar timeout na Vercel. Podes analisar o código se eu o colar abaixo?" }
            ]
        };

        let sessions = JSON.parse(localStorage.getItem('ai_hub_v4_sessions') || '[]');
        let activeId = localStorage.getItem('ai_hub_v4_active');
        let fileContent = "";

        function init() {
            if (!sessions.length) newChat();
            else loadSession(activeId || sessions[0].id);
        }

        function autoResize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; }

        function newChat() {
            const id = 'ws_' + Date.now();
            sessions.unshift({ 
                id, 
                title: 'Novo Workspace', 
                agent: document.getElementById('agent-select').value || 'Geral',
                history: [] 
            });
            loadSession(id);
        }

        function clearCurrentChat() {
            if(!confirm("Limpar todo o histórico desta conversa?")) return;
            const s = sessions.find(s => s.id === activeId);
            if(s) { s.history = []; save(); loadSession(activeId); }
        }

        function renderWelcomeScreen(agent) {
            const msgDiv = document.getElementById('chat-messages');
            const prompts = dynamicPrompts[agent];
            let html = `<div class="welcome-hero"><h2>Workspace: ${agent}</h2><p>Módulo carregado com sucesso. Como posso otimizar a sua operação hoje?</p><div class="quick-actions">`;
            prompts.forEach(p => {
                const safePrompt = p.prompt.replace(/'/g, "\\'");
                html += `<button class="quick-btn" onclick="setPrompt('${safePrompt}')">${p.icon} ${p.text}</button>`;
            });
            html += `</div></div>`;
            msgDiv.innerHTML = html;
        }

        function loadSession(id) {
            activeId = id;
            const s = sessions.find(s => s.id === id) || sessions[0];
            
            document.getElementById('agent-select').value = s.agent;
            document.getElementById('chat-title').innerText = s.title;
            document.getElementById('chat-sub').innerText = `Sistema Operativo • ${s.agent}`;
            
            if (s.history.length === 0) {
                renderWelcomeScreen(s.agent);
            } else {
                const msgDiv = document.getElementById('chat-messages');
                msgDiv.innerHTML = '';
                s.history.forEach(m => renderMessage(m.parts[0].text, m.role, false));
            }
            save(); renderList();
        }

        function setPrompt(text) {
            document.getElementById('user-input').value = text;
            autoResize(document.getElementById('user-input'));
            document.getElementById('user-input').focus();
        }

        function updateSession() {
            const s = sessions.find(s => s.id === activeId);
            s.agent = document.getElementById('agent-select').value;
            document.getElementById('chat-sub').innerText = `Sistema Operativo • ${s.agent}`;
            
            if (s.history.length === 0) renderWelcomeScreen(s.agent);
            save();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            sessions = sessions.filter(s => s.id !== id);
            init();
        }

        function renderList() {
            const list = document.getElementById('history-list');
            list.innerHTML = sessions.map(s => `
                <div class="chat-item ${s.id === activeId ? 'active' : ''}" onclick="loadSession('${s.id}')">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">💬 ${s.title}</span>
                    <span class="delete-btn" onclick="deleteChat('${s.id}', event)" title="Apagar">✕</span>
                </div>
            `).join('');
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = res => { 
                fileContent = `\n\n[DADOS DE CONTEXTO - Ficheiro: ${file.name}]\n${res.target.result}`; 
                document.getElementById('file-name').innerText = file.name;
                document.getElementById('preview-container').style.display = 'flex';
            };
            reader.readAsText(file);
        }

        function clearFile() {
            fileContent = ""; document.getElementById('file-input').value = '';
            document.getElementById('preview-container').style.display = 'none';
        }

        function checkEnter(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            let text = input.value.trim() + fileContent;
            if (!text) return;
            
            const s = sessions.find(s => s.id === activeId);
            if (s.history.length === 0) document.getElementById('chat-messages').innerHTML = '';
            
            if (s.title === 'Novo Workspace') {
                const rawText = input.value.trim();
                s.title = rawText.length > 25 ? rawText.substring(0, 25) + '...' : rawText;
                document.getElementById('chat-title').innerText = s.title;
            }

            renderMessage(text, 'user');
            const tempHistory = [...s.history, { role: 'user', parts: [{ text }] }];
            
            input.value = ''; input.style.height = 'auto'; clearFile();
            const loadId = renderLoading();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        history: tempHistory, 
                        systemInstruction: personas[s.agent]
                    })
                });
                
                const data = await res.json();
                document.getElementById(loadId).remove();
                
                if (res.ok) {
                    s.history = tempHistory;
                    s.history.push({ role: 'model', parts: [{ text: data.text }] });
                    renderMessage(data.text, 'bot');
                } else {
                    renderMessage(`⚠️ **Atenção:** ${data.error}`, 'bot');
                }
                save();
            } catch (err) {
                document.getElementById(loadId).remove();
                renderMessage('❌ Ocorreu uma falha de conexão na Vercel.', 'bot');
            }
        }

        function renderMessage(text, role, animate=true) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = role === 'bot' ? marked.parse(text) : text;
            wrapper.appendChild(div);
            document.getElementById('chat-messages').appendChild(wrapper);
            wrapper.scrollIntoView({ behavior: animate ? 'smooth' : 'auto' });
        }

        function renderLoading() {
            const wrapper = document.createElement('div');
            wrapper.id = 'loading_' + Date.now();
            wrapper.className = `message-wrapper bot`;
            wrapper.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            document.getElementById('chat-messages').appendChild(wrapper);
            wrapper.scrollIntoView({ behavior: 'smooth' });
            return wrapper.id;
        }

        function save() {
            localStorage.setItem('ai_hub_v4_sessions', JSON.stringify(sessions));
            localStorage.setItem('ai_hub_v4_active', activeId);
            renderList();
        }

        function exportTXT() {
            const s = sessions.find(s => s.id === activeId);
            const content = s.history.map(m => `${m.role.toUpperCase()}:\n${m.parts[0].text}\n`).join('\n---\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `Workspace_${Date.now()}.txt`; a.click();
        }

        function exportPDF() {
            const element = document.getElementById('chat-messages');
            html2pdf().from(element).set({ margin: [10, 10], filename: `Workspace_${Date.now()}.pdf` }).save();
        }

        window.onload = init;
    </script>
</body>
</html>
