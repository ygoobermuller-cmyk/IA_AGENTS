<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Agent Pro - Enterprise</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --user-msg: #1e293b;
            --bot-msg: #111827;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 280px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px 16px; }
        .sidebar h2 { font-size: 15px; font-weight: 600; margin-bottom: 24px; color: #fff; display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
        .agent-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .agent-item { padding: 12px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; }
        .agent-item:hover { background-color: #1f2937; color: var(--text-primary); }
        .agent-item.active { background-color: #1e3a8a; color: #93c5fd; font-weight: 500; border: 1px solid #3b82f6; }

        /* Main Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-color); }
        .chat-header { padding: 18px 30px; background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-header span { font-weight: 600; font-size: 15px; color: #fff; }

        .chat-messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .message.user { background-color: var(--user-msg); align-self: flex-end; border: 1px solid #334155; }
        .message.bot { background-color: var(--bot-msg); align-self: flex-start; border: 1px solid var(--border-color); }
        
        /* Estilização de código nas mensagens */
        .message pre { background: #030712; padding: 10px; border-radius: 6px; margin-top: 8px; overflow-x: auto; border: 1px solid #1f2937; }
        .message code { font-family: monospace; font-size: 13px; color: #60a5fa; }

        /* Input Area */
        .chat-input-area { padding: 20px 30px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
        
        #preview-container { display: none; align-items: center; gap: 12px; background: #1f2937; padding: 8px 12px; border-radius: 8px; width: fit-content; font-size: 13px; border: 1px solid #374151; }
        #preview-container img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
        #remove-file { color: #ef4444; cursor: pointer; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        #remove-file:hover { background: rgba(239, 68, 68, 0.2); }

        .input-wrapper { display: flex; align-items: center; gap: 12px; background-color: #030712; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 16px; }
        .input-wrapper:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        .chat-input-area textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; resize: none; outline: none; max-height: 120px; line-height: 1.5; }
        
        .attach-btn { cursor: pointer; color: var(--text-secondary); font-size: 20px; transition: color 0.2s; display: flex; align-items: center; }
        .attach-btn:hover { color: var(--accent-blue); }
        
        .send-btn { background-color: var(--accent-blue); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚡ AI Multi-Agent Pro</h2>
        <ul class="agent-list">
            <li class="agent-item active" onclick="selectAgent('Assistente Geral', this)">🛡️ Assistente Geral</li>
            <li class="agent-item" onclick="selectAgent('Infraestrutura & Sistemas', this)">⚙️ Infraestrutura & Sistemas</li>
            <li class="agent-item" onclick="selectAgent('Desenvolvimento & Código', this)">💻 Desenvolvimento & Código</li>
        </ul>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <span id="current-agent-title">Agente Ativo: Assistente Geral</span>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">Olá! Sistema preparado e operativo com redundância de modelos ativa. Como posso ajudar hoje? Pode anexar imagens ou capturas de ecrã se precisar.</div>
        </div>

        <div class="chat-input-area">
            <div id="preview-container">
                <img id="file-preview" src="" alt="preview">
                <span id="file-name" style="color: #fff;"></span>
                <span id="remove-file" onclick="clearFile()" title="Remover anexo">✕</span>
            </div>
            <div class="input-wrapper">
                <label for="file-input" class="attach-btn" title="Anexar imagem ou documento">📎</label>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
                <textarea id="user-input" rows="1" placeholder="Escreva a sua mensagem ou cole uma instrução..." onkeydown="checkEnter(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = "Assistente Geral";
        let chatHistory = [];
        let attachedFile = null;

        function selectAgent(agentName, element) {
            currentAgent = agentName;
            document.getElementById('current-agent-title').innerText = `Agente Ativo: ${agentName}`;
            document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                attachedFile = file;
                document.getElementById('file-name').innerText = file.name;
                if (file.type.startsWith('image/')) {
                    document.getElementById('file-preview').src = URL.createObjectURL(file);
                }
                document.getElementById('preview-container').style.display = 'flex';
            }
        }

        function clearFile() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('preview-container').style.display = 'none';
        }

        function checkEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !attachedFile) return;

            let parts = [];
            let displayMessage = text;

            if (text) {
                parts.push({ text: `[Contexto - Especialidade Ativa: ${currentAgent}] ${text}` });
            }

            if (attachedFile) {
                const base64Data = await toBase64(attachedFile);
                parts.push({
                    inlineData: {
                        mimeType: attachedFile.type,
                        data: base64Data
                    }
                });
                displayMessage += ` [📎 Ficheiro anexado: ${attachedFile.name}]`;
            }

            appendMessage(displayMessage, 'user');
            chatHistory.push({ role: 'user', parts: parts });

            input.value = '';
            clearFile();

            const loadingId = appendMessage('A processar com redundância ativada...', 'bot loading');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (response.ok) {
                    appendMessage(data.text, 'bot');
                    chatHistory.push({ role: 'model', parts: [{ text: data.text }] });
                } else {
                    appendMessage(`⚠️ Erro: ${data.error || 'Falha na resposta do servidor.'}`, 'bot');
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('❌ Erro de conexão com o servidor da Vercel.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now();
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return msgId;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
