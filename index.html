<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Pro</title>
    <!-- Marked.js para Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- html2pdf para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-main: #07090e; --bg-sidebar: #0d1117; --bg-panel: #161b22;
            --border-color: #21262d; --text-primary: #e6edf3; --text-secondary: #8b949e;
            --accent-blue: #2f81f7; --accent-hover: #388bfd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 320px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 16px; gap: 16px; }
        .sidebar-header h1 { font-size: 16px; font-weight: 600; color: #fff; }
        
        .btn-primary { background: var(--accent-blue); color: white; border: none; border-radius: 8px; padding: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: var(--accent-hover); }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .select-box { background: var(--bg-panel); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; font-size: 13px; outline: none; cursor: pointer; }

        .history-section { flex: 1; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
        .chat-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .chat-item.active { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb66; }
        .delete-btn { color: #f85149; font-size: 12px; cursor: pointer; opacity: 0; }
        .chat-item:hover .delete-btn { opacity: 1; }

        /* Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); }
        .chat-header { padding: 16px 24px; background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 10px; }
        .btn-export { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s;}
        .btn-export:hover { border-color: var(--text-primary); color: var(--text-primary); }

        .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .message.user { background-color: #1f242c; align-self: flex-end; border: 1px solid var(--border-color); }
        .message.bot { background-color: var(--bg-panel); align-self: flex-start; border: 1px solid var(--border-color); width: 100%; }
        
        /* Markdown & Code Copy */
        .code-wrapper { position: relative; margin: 12px 0; background: #030712; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .code-header { display: flex; justify-content: space-between; background: #161b22; padding: 6px 12px; border-bottom: 1px solid var(--border-color); }
        .copy-btn { background: transparent; border: none; color: #8b949e; cursor: pointer; font-size: 12px; transition: color 0.2s; }
        .copy-btn:hover { color: #58a6ff; }
        .code-wrapper pre { margin: 0; padding: 12px; overflow-x: auto; }
        .code-wrapper code { font-family: monospace; font-size: 13px; color: #79c0ff; }
        
        /* Input Area */
        .input-area { padding: 20px 24px; background: var(--bg-sidebar); border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
        .input-box { flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 10px; display: flex; padding: 8px 12px; align-items: center; }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; resize: none; outline: none; max-height: 120px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>⚡ AI Hub Enterprise</h1>
        </div>
        <button class="btn-primary" onclick="newChat()">＋ Novo Chat</button>

        <div class="form-group">
            <label>Especialidade do Agente</label>
            <select id="agent-select" class="select-box" onchange="updateSession()">
                <option value="Geral">🛡️ Assistente Geral</option>
                <option value="Sistemas">⚙️ Infra & Sistemas (SAP/Salesforce)</option>
                <option value="Dev">💻 Desenvolvimento (Code/API)</option>
            </select>
        </div>

        <div class="history-section" id="history-list"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div>
                <h3 id="chat-title" style="font-size: 15px;">Novo Chat</h3>
                <span id="chat-sub" style="font-size: 12px; color: #8b949e;">Powered by Gemini 1.5 Flash</span>
            </div>
            <div class="header-actions">
                <button class="btn-export" onclick="exportTXT()">Exportar TXT</button>
                <button class="btn-export" onclick="exportPDF()">Exportar PDF</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="input-area">
            <div class="input-box">
                <label for="file-input" style="cursor:pointer; margin-right:10px; color:#8b949e;" title="Anexar texto/log">📎</label>
                <input type="file" id="file-input" accept=".txt,.csv,.json,.js,.log,.md,.sql" style="display:none;" onchange="handleFile(event)" />
                <textarea id="user-input" rows="1" placeholder="Escreva ou cole o seu código/logs..." onkeydown="checkEnter(event)"></textarea>
            </div>
            <button class="btn-primary" onclick="sendMsg()">Enviar</button>
        </div>
    </div>

    <script>
        // Configuração do Marked.js para injetar o botão "Copiar"
        const renderer = new marked.Renderer();
        renderer.code = function({text, lang}) {
            const codeContent = text.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `
                <div class="code-wrapper">
                    <div class="code-header">
                        <span style="color:#8b949e; font-size:12px;">${lang || 'code'}</span>
                        <button class="copy-btn" onclick="navigator.clipboard.writeText(\`${codeContent}\`)">Copiar</button>
                    </div>
                    <pre><code>${codeContent}</code></pre>
                </div>`;
        };
        marked.setOptions({ renderer: renderer });

        const personas = {
            "Geral": "És um assistente corporativo versátil, especialista em produtividade e resolução de problemas. Responde de forma clara.",
            "Sistemas": "És um engenheiro sénior de infraestrutura. Especialista em SAP S/4HANA, Salesforce, e Senior HCM. Responde de forma técnica e direta.",
            "Dev": "És um programador Full-Stack sénior. Especialista em Node.js, Javascript e integrações. Gera código limpo e comentado."
        };

        let sessions = JSON.parse(localStorage.getItem('gemini_sessions') || '[]');
        let activeId = localStorage.getItem('gemini_active_id');
        let fileContent = "";

        function init() {
            if (!sessions.length) newChat();
            else loadSession(activeId || sessions[0].id);
        }

        function newChat() {
            const id = 'chat_' + Date.now();
            sessions.unshift({ id, title: 'Novo Chat', agent: 'Geral', history: [] });
            loadSession(id);
        }

        function loadSession(id) {
            activeId = id;
            const s = sessions.find(s => s.id === id) || sessions[0];
            document.getElementById('agent-select').value = s.agent;
            document.getElementById('chat-title').innerText = s.title;
            
            const msgDiv = document.getElementById('chat-messages');
            msgDiv.innerHTML = s.history.length ? '' : `<div class="message bot">Pronto a ajudar! Configurei-me como **${s.agent}**. Como procedemos?</div>`;
            
            s.history.forEach(m => addBubble(m.parts[0].text, m.role, false));
            save();
            renderList();
        }

        function updateSession() {
            const s = sessions.find(s => s.id === activeId);
            s.agent = document.getElementById('agent-select').value;
            save();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            sessions = sessions.filter(s => s.id !== id);
            init();
        }

        function renderList() {
            const list = document.getElementById('history-list');
            list.innerHTML = sessions.map(s => `
                <div class="chat-item ${s.id === activeId ? 'active' : ''}" onclick="loadSession('${s.id}')">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.title}</span>
                    <span class="delete-btn" onclick="deleteChat('${s.id}', event)">🗑️</span>
                </div>
            `).join('');
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = res => { fileContent = `\n\n[Ficheiro Anexado: ${file.name}]\n${res.target.result}`; };
            reader.readAsText(file);
        }

        function checkEnter(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            let text = input.value.trim() + fileContent;
            if (!text) return;
            
            const s = sessions.find(s => s.id === activeId);
            if (s.title === 'Novo Chat') s.title = text.substring(0, 25) + '...';

            addBubble(text, 'user');
            s.history.push({ role: 'user', parts: [{ text }] });
            
            input.value = '';
            fileContent = '';
            save();

            const loadId = addBubble('A processar...', 'bot loading');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        history: s.history,
                        systemInstruction: personas[s.agent]
                    })
                });
                const data = await res.json();
                document.getElementById(loadId).remove();
                
                if (res.ok) {
                    addBubble(data.text, 'bot');
                    s.history.push({ role: 'model', parts: [{ text: data.text }] });
                    save();
                } else addBubble('Erro: ' + data.error, 'bot');
            } catch (err) {
                document.getElementById(loadId).remove();
                addBubble('Falha na ligação.', 'bot');
            }
        }

        function addBubble(text, role, animate=true) {
            const div = document.createElement('div');
            div.id = 'msg_' + Date.now();
            div.className = `message ${role}`;
            div.innerHTML = (role.includes('bot') && !role.includes('loading')) ? marked.parse(text) : text;
            document.getElementById('chat-messages').appendChild(div);
            div.scrollIntoView({ behavior: animate ? 'smooth' : 'auto' });
            return div.id;
        }

        function save() {
            localStorage.setItem('gemini_sessions', JSON.stringify(sessions));
            localStorage.setItem('gemini_active_id', activeId);
            renderList();
        }

        function exportTXT() {
            const s = sessions.find(s => s.id === activeId);
            const content = s.history.map(m => `${m.role.toUpperCase()}:\n${m.parts[0].text}\n`).join('\n---\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `chat_${Date.now()}.txt`;
            a.click();
        }

        function exportPDF() {
            const element = document.getElementById('chat-messages');
            html2pdf().from(element).set({ margin: 10, filename: `chat_${Date.now()}.pdf` }).save();
        }

        window.onload = init;
    </script>
</body>
</html>
