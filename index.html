<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Agent Pro</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --accent-color: #238636;
            --accent-blue: #1f6feb;
            --user-msg: #1f242c;
            --bot-msg: #161b22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { font-size: 16px; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .agent-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .agent-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        .agent-item:hover, .agent-item.active { background-color: #21262d; color: #58a6ff; font-weight: 500; }

        /* Main Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { padding: 15px 25px; background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-header span { font-weight: 600; color: #fff; }

        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .message.user { background-color: var(--user-msg); align-self: flex-end; border: 1px solid var(--border-color); }
        .message.bot { background-color: var(--bot-msg); align-self: flex-start; border: 1px solid var(--border-color); }

        /* Input Area */
        .chat-input-area { padding: 20px 25px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .input-wrapper { display: flex; align-items: center; gap: 10px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; }
        .chat-input-area textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; resize: none; outline: none; max-height: 120px; }
        
        .action-btns { display: flex; align-items: center; gap: 10px; }
        .attach-btn { cursor: pointer; color: #8b949e; font-size: 18px; transition: color 0.2s; }
        .attach-btn:hover { color: #58a6ff; }
        .send-btn { background-color: var(--accent-blue); color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background-color: #388bfd; }

        /* Preview anexo */
        #preview-container { display: none; align-items: center; gap: 10px; background: #21262d; padding: 6px 10px; border-radius: 6px; width: fit-content; font-size: 12px; }
        #preview-container img { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; }
        #remove-file { color: #f85149; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🤖 AI Multi-Agent</h2>
        <ul class="agent-list">
            <li class="agent-item active" onclick="selectAgent('Assistente Geral')">Assistente Geral</li>
            <li class="agent-item" onclick="selectAgent('Infraestrutura & Sistemas')">Infraestrutura & Sistemas</li>
            <li class="agent-item" onclick="selectAgent('Desenvolvimento & Código')">Desenvolvimento & Código</li>
        </ul>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <span id="current-agent-title">Agente: Assistente Geral</span>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">Olá! Sou o seu assistente. Como posso ajudar hoje? Pode inclusive enviar imagens ou capturas de ecrã para analisar.</div>
        </div>

        <div class="chat-input-area">
            <div id="preview-container">
                <img id="file-preview" src="" alt="preview">
                <span id="file-name"></span>
                <span id="remove-file" onclick="clearFile()">✕</span>
            </div>
            <div class="input-wrapper">
                <label for="file-input" class="attach-btn" title="Anexar imagem">📎</label>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
                <textarea id="user-input" rows="1" placeholder="Digite a sua mensagem..." onkeydown="checkEnter(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = "Assistente Geral";
        let chatHistory = [];
        let attachedFile = null;

        function selectAgent(agentName) {
            currentAgent = agentName;
            document.getElementById('current-agent-title').innerText = `Agente: ${agentName}`;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                attachedFile = file;
                document.getElementById('file-name').innerText = file.name;
                if (file.type.startsWith('image/')) {
                    document.getElementById('file-preview').src = URL.createObjectURL(file);
                }
                document.getElementById('preview-container').style.display = 'flex';
            }
        }

        function clearFile() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('preview-container').style.display = 'none';
        }

        function checkEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !attachedFile) return;

            let parts = [];
            if (text) parts.push({ text: `[Contexto - Agente Ativo: ${currentAgent}] ${text}` });

            if (attachedFile) {
                const base64Data = await toBase64(attachedFile);
                parts.push({
                    inlineData: {
                        mimeType: attachedFile.type,
                        data: base64Data
                    }
                });
            }

            // Adiciona mensagem do utilizador visualmente
            appendMessage(text || "[Ficheiro Anexado]", 'user');
            chatHistory.push({ role: 'user', parts: parts });

            input.value = '';
            const sentFile = attachedFile;
            clearFile();

            // Mostra indicador de loading
            const loadingId = appendMessage('A pensar...', 'bot loading');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (response.ok) {
                    appendMessage(data.text, 'bot');
                    chatHistory.push({ role: 'model', parts: [{ text: data.text }] });
                } else {
                    appendMessage(`Erro: ${data.error || 'Falha na comunicação.'}`, 'bot');
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('Erro de conexão com o servidor.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now();
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return msgId;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
