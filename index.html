<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .chat-container {
            height: calc(100vh - 180px);
        }

        /* Custom scrollbar for chat */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #94a3b8;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .message-content {
            white-space: pre-wrap; /* Preserves line breaks from the API */
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen w-full">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl flex flex-col h-[95vh] sm:h-[90vh] overflow-hidden border border-gray-200 m-4">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex flex-col sm:flex-row justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3 mb-3 sm:mb-0">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                    <i class="fa-solid fa-robot text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">AI Multi-Agent</h1>
                    <p class="text-xs text-indigo-200">Plataforma de Assistentes Especializados</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 bg-white/10 rounded-lg p-1 px-2 border border-white/20">
                <label for="agent-select" class="text-sm font-medium"><i class="fa-solid fa-users-gear mr-1"></i> Agente:</label>
                <select id="agent-select" class="bg-transparent text-white text-sm font-semibold focus:outline-none cursor-pointer p-1 [&>option]:text-gray-800">
                    <option value="geral">Assistente Geral</option>
                    <option value="sistemas">Especialista em Sistemas</option>
                </select>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-window" class="chat-container overflow-y-auto p-4 sm:p-6 flex-1 bg-slate-50 flex flex-col gap-4">
            <!-- Messages will be injected here -->
        </div>

        <!-- Loading Indicator (Hidden by default) -->
        <div id="loading-indicator" class="hidden px-6 py-2 bg-slate-50">
            <div class="bg-gray-200 rounded-2xl rounded-bl-none px-4 py-3 inline-block w-fit">
                <div class="typing-indicator flex items-center h-5">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white border-t border-gray-200 p-4">
            <form id="chat-form" class="flex gap-2 relative">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Digite sua mensagem para o agente..." 
                    class="w-full bg-gray-100 border border-gray-300 text-gray-800 rounded-full pl-5 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner"
                    autocomplete="off"
                    required
                >
                <button 
                    type="submit" 
                    id="send-btn"
                    class="absolute right-2 top-1/2 transform -translate-y-1/2 w-10 h-10 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full flex items-center justify-center transition-colors shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
            <div class="text-center mt-2">
                <span class="text-[10px] text-gray-400">Powered by Gemini API</span>
            </div>
        </div>
    </div>

    <script>
        // Configuração dos Agentes
        const agentsConfig = {
            "geral": {
                name: "Assistente Geral",
                icon: "fa-regular fa-comments",
                color: "bg-blue-500",
                welcomeMessage: "Olá! Sou seu Assistente Geral. Posso te ajudar com dúvidas cotidianas, traduções, resumos, receitas e muito mais. Como posso ser útil hoje?",
                systemInstruction: "Você é um assistente virtual amigável, claro e prestativo. Seu objetivo é ajudar o usuário com perguntas gerais do dia a dia, curiosidades, conselhos práticos e conhecimentos gerais. Responda de forma concisa e educada, usando formatação simples e agradável."
            },
            "sistemas": {
                name: "Especialista em Sistemas",
                icon: "fa-solid fa-network-wired",
                color: "bg-emerald-600",
                welcomeMessage: "Saudações. Sou o Especialista em Sistemas e Integrações. Pronto para analisar arquiteturas, solucionar problemas em ERPs corporativos (SAP, TOTVS, Salesforce) e discutir fluxos de dados. Qual o desafio técnico de hoje?",
                systemInstruction: "Você é um Especialista em Sistemas Sênior e Arquiteto de Integrações. Seu foco é analisar dados, arquitetura de software, ERPs corporativos (como SAP, TOTVS, Oracle, Salesforce), bancos de dados (SQL/NoSQL) e integrações de APIs (REST/SOAP/GraphQL). Forneça respostas técnicas, precisas, bem estruturadas e com exemplos de código ou consultas quando aplicável. Assuma que o usuário tem conhecimento técnico moderado a avançado. Seja direto e analítico."
            }
        };

        // Estado da aplicação
        let currentAgentId = 'geral';
        // Dicionário para armazenar o histórico de cada agente separadamente
        const chatHistories = {
            "geral": [],
            "sistemas": []
        };
        const apiKey = ""; // Canvas will inject API Key here
        let isWaitingForResponse = false;

        // Elementos do DOM
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const agentSelect = document.getElementById('agent-select');
        const loadingIndicator = document.getElementById('loading-indicator');

        
        // Função para rolar o chat para baixo
        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Adiciona uma mensagem na interface (UI)
        function renderMessage(text, sender, agentId = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('flex', 'w-full', 'mb-2', 'animate-fade-in');
            
            const isUser = sender === 'user';
            
            if (isUser) {
                messageDiv.classList.add('justify-end');
                messageDiv.innerHTML = `
                    <div class="max-w-[80%] bg-indigo-600 text-white rounded-2xl rounded-br-none px-4 py-3 shadow-sm">
                        <p class="text-sm message-content">${escapeHTML(text)}</p>
                    </div>
                `;
            } else {
                const agent = agentsConfig[agentId] || agentsConfig['geral'];
                messageDiv.classList.add('justify-start');
                messageDiv.innerHTML = `
                    <div class="flex items-end gap-2 max-w-[85%]">
                        <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs ${agent.color} shadow-sm mb-1">
                            <i class="${agent.icon}"></i>
                        </div>
                        <div class="bg-white border border-gray-100 text-gray-800 rounded-2xl rounded-bl-none px-4 py-3 shadow-sm">
                            <div class="text-xs font-bold mb-1 text-gray-500">${agent.name}</div>
                            <p class="text-sm message-content">${formatText(escapeHTML(text))}</p>
                        </div>
                    </div>
                `;
            }
            
            chatWindow.appendChild(messageDiv);
            scrollToBottom();
        }

        // Escapa HTML para prevenir XSS simples
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Formatação básica (Transforma **texto** em negrito) - Opcional, para melhorar visualização
        function formatText(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        // Alternar status de carregamento
        function setLoading(isLoading) {
            isWaitingForResponse = isLoading;
            userInput.disabled = isLoading;
            sendBtn.disabled = isLoading;
            if (isLoading) {
                loadingIndicator.classList.remove('hidden');
                scrollToBottom();
            } else {
                loadingIndicator.classList.add('hidden');
                userInput.focus();
            }
        }

        // Renderiza o histórico atual do agente selecionado
        function loadAgentChat() {
            chatWindow.innerHTML = ''; // Limpa a tela
            const history = chatHistories[currentAgentId];
            const agent = agentsConfig[currentAgentId];

            // Renderiza mensagem de boas-vindas
            renderMessage(agent.welcomeMessage, 'model', currentAgentId);

            // Renderiza o histórico armazenado
            history.forEach(msg => {
                if (msg.role === 'user') {
                    renderMessage(msg.parts[0].text, 'user');
                } else {
                    renderMessage(msg.parts[0].text, 'model', currentAgentId);
                }
            });
        }

        
        // Chamada à API do Gemini
        async function fetchGeminiResponse(userText) {
            const agent = agentsConfig[currentAgentId];
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            // Constrói o payload com as instruções de sistema e histórico atual
            const payload = {
                systemInstruction: {
                    parts: [{ text: agent.systemInstruction }]
                },
                contents: [
                    ...chatHistories[currentAgentId], // Histórico do agente
                    { role: "user", parts: [{ text: userText }] } // Nova mensagem
                ]
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const aiText = candidate.content.parts[0].text;
                    
                    // Atualiza o histórico localmente (Memória do Agente)
                    chatHistories[currentAgentId].push({ role: "user", parts: [{ text: userText }] });
                    chatHistories[currentAgentId].push({ role: "model", parts: [{ text: aiText }] });

                    // Renderiza a resposta
                    renderMessage(aiText, 'model', currentAgentId);
                } else {
                    renderMessage("Desculpe, recebi uma resposta vazia ou em formato inesperado da API.", 'model', currentAgentId);
                }

            } catch (error) {
                console.error("Erro na API:", error);
                renderMessage("Desculpe, ocorreu um erro ao comunicar com os servidores. Verifique o console para mais detalhes.", 'model', currentAgentId);
            } finally {
                setLoading(false);
            }
        }


        // Evento de envio do formulário
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isWaitingForResponse) return;

            const text = userInput.value.trim();
            if (!text) return;

            // Limpa o input
            userInput.value = '';
            
            // Mostra a mensagem do usuário
            renderMessage(text, 'user');
            
            // Inicia o estado de loading e chama a API
            setLoading(true);
            await fetchGeminiResponse(text);
        });

        // Evento de troca de agente
        agentSelect.addEventListener('change', (e) => {
            currentAgentId = e.target.value;
            loadAgentChat(); // Recarrega o contexto e a UI
        });

        // Inicialização
        window.onload = () => {
            // Carrega o agente inicial
            loadAgentChat();
            userInput.focus();
        };

        // Adicionando um pequeno estilo de fade in dinamico via JS
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in {
                animation: fadeIn 0.3s ease-out forwards;
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
